schema_version: 1

context:
  name: de-dip-bundestag
  version: 0.1.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 7abf4205f92d599294ab3828861ec20f224ccf8b546573e7eaa0e9acb771c078

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.dip_bundestag
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: "Bundestag: Dokumentations- und Informationssystem für Parlamentsmaterialien"
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/bundesAPI/dip-bundestag-api

extra:
  recipe-maintainers:
    - jan-janssen
